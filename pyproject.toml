[project]
name = "cloudfile"
version = "0.1.0"
description = "CloudFile large-file upload and asynchronous media processing platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "pymysql>=1.1.0",
    "redis>=5.0.4",
    "pika>=1.3.2",
    "minio>=7.2.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["cloudfile*"]
exclude = ["frontend*", "tests*"]
