services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: cloudfile
      MYSQL_DATABASE: cloudfile
      MYSQL_USER: cloudfile
      MYSQL_PASSWORD: cloudfile
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    command: cloudfile-api
    environment:
      HTTP_ADDR: :8000
      DATABASE_DRIVER: mysql
      DATABASE_DSN: cloudfile:cloudfile@tcp(mysql:3306)/cloudfile?parseTime=true&loc=Local
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cloudfile
      MINIO_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
      QUEUE_DRIVER: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MEDIA_PROCESSOR: ffmpeg
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio
    ports:
      - "8000:8000"

  worker:
    build: .
    command: cloudfile-worker
    environment:
      DATABASE_DRIVER: mysql
      DATABASE_DSN: cloudfile:cloudfile@tcp(mysql:3306)/cloudfile?parseTime=true&loc=Local
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cloudfile
      MINIO_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
      QUEUE_DRIVER: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MEDIA_PROCESSOR: ffmpeg
      FFMPEG_TIMEOUT_SECONDS: 300
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio

volumes:
  mysql_data:
  minio_data:
